blueprint:
  name: Valore Ringbell – zvonění a obraz na iPhonu
  description: >
    Po stisku zvonku přehraje zvuk oznámení, nabídne náhled a klepnutím otevře
    kameru Valore v aplikaci Home Assistant.
  domain: automation
  homeassistant:
    min_version: 2026.10.4
  input:
    ring_event:
      name: Zazvonění
      selector:
        entity:
          filter:
            - domain: event
              integration: valore_ringbell
    camera_entity:
      name: Kamera Valore
      selector:
        entity:
          filter:
            - domain: camera
              integration: valore_ringbell
    iphone:
      name: iPhone
      description: Vyber telefon registrovaný v aplikaci Home Assistant.
      selector:
        device:
          filter:
            - integration: mobile_app
    sound:
      name: Zvuk oznámení
      description: Ponech systémový zvuk nebo zadej název zvuku naimportovaného v aplikaci.
      default: default
      selector:
        text:
    live_activity:
      name: Živá aktivita na iPhonu
      description: Zobrazí stav hovoru na zamčené obrazovce a v Dynamic Island.
      default: false
      selector:
        boolean:
    dashboard_path:
      name: Cesta k nástěnce pro hovor
      description: Například /valore-u-dveri/kamera. Prázdné pole otevře samotnou kameru.
      default: ""
      selector:
        text:

mode: queued
max: 10
variables:
  camera: !input camera_entity
  sound: !input sound
  dashboard: !input dashboard_path
  live_activity: !input live_activity
  tag: "{{ 'valore_' ~ camera.split('.')[-1][:56] }}"
  hangup_prefix: "{{ 'VALORE_HANGUP_' ~ camera ~ '_' }}"
  destination: >-
    {{ dashboard ~ ('&' if '?' in dashboard else '?') ~ 'valore_answer=1'
       if dashboard else '/?more-info-entity-id=' ~ camera }}
triggers:
  - trigger: state
    id: ring
    entity_id: !input ring_event
    not_from:
      - unavailable
    not_to:
      - unavailable
      - unknown
  - trigger: event
    id: call
    event_type: valore_ringbell_call_state
  - trigger: event
    id: hangup
    event_type: mobile_app_notification_action
conditions:
  - condition: template
    value_template: >-
      {{ trigger is not defined or not trigger.platform or
         (trigger.id == 'ring' and trigger.from_state is not none and
          trigger.to_state.attributes.get('event_type') == 'ring') or
         (trigger.id == 'call' and live_activity and
          trigger.event.data.device_id == device_id(camera)) or
         (trigger.id == 'hangup' and
          (trigger.event.data.action | default('') | string).startswith(hangup_prefix) and
          (trigger.event.data.action.rsplit('_', 1)[1] is match('^[a-f0-9]{24}$'))) }}
actions:
  - if:
      - condition: template
        value_template: "{{ trigger is defined and trigger.id | default('') == 'hangup' }}"
    then:
      - action: valore_ringbell.hangup
        data:
          entity_id: "{{ camera }}"
          call_id: "{{ trigger.event.data.action.rsplit('_', 1)[1] }}"
    else:
      - if:
          - condition: template
            value_template: "{{ trigger is defined and trigger.id | default('') == 'call' }}"
        then:
          - device_id: !input iphone
            domain: mobile_app
            type: notify
            title: U dveří
            message: >-
              {{ {'idle': 'clear_notification', 'ringing': 'Někdo zvoní u dveří',
                  'answered': 'Hovor probíhá'}[trigger.event.data.state] }}
            data: >-
              {% set state = trigger.event.data.state %}
              {% set activity = {'tag': tag, 'live_update': true, 'url': destination,
                                 'alert_once': true, 'notification_icon': 'mdi:doorbell-video',
                                 'notification_icon_color': '#81E4CE', 'background_color': '#102321',
                                 'text_color': '#EAF7F2', 'relevance_score': 0.9} %}
              {{ {'tag': tag} if state == 'idle' else
                 dict(activity, chronometer=true, when=trigger.event.data.deadline) if state == 'ringing' else
                 dict(activity, chronometer=false, silent=true, critical_text='Živý hovor') }}
        else:
          - device_id: !input iphone
            domain: mobile_app
            type: notify
            title: Valore
            message: Někdo zvoní u dveří
            data: >-
              {% set photo = trigger.to_state.attributes.get('snapshot_url')
                if trigger is defined and trigger.to_state is defined and trigger.to_state is not none else none %}
              {% set call_id = trigger.to_state.attributes.get('call_id')
                if trigger is defined and trigger.to_state is defined and trigger.to_state is not none else none %}
              {% set payload = {'url': destination, 'push': {'sound': sound}} %}
              {% if call_id %}
                {% set payload = dict(payload, actions=[{'action': hangup_prefix ~ call_id, 'title': 'Položit',
                  'destructive': true, 'authenticationRequired': true, 'icon': 'sfsymbols:phone.down'}]) %}
              {% endif %}
              {{ dict(payload, image=photo) if photo else dict(payload, entity_id=camera) }}
